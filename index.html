<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>初等考題庫練習</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <!-- 密碼關卡 -->
    <div id="gate">
      <div class="gate-card">
        <h1>初等考題庫練習</h1>
        <p>此題庫受密碼保護，請輸入密碼開啟。</p>
        <form id="gateForm" class="gate-row" autocomplete="off">
          <input id="gatePw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="輸入密碼" aria-label="密碼" />
          <button id="gateBtn" class="gate-btn" type="submit">開啟</button>
        </form>
        <label class="gate-show"><input type="checkbox" id="gateShow" /> 顯示密碼</label>
        <div class="gate-error" id="gateError" role="alert"></div>
      </div>
    </div>

    <!-- 主應用（解密成功後才顯示） -->
    <div id="app-root" hidden>
      <header class="app-header">
        <div>
          <h1>初等考題庫練習</h1>
          <p id="bankSummary"></p>
        </div>
        <div class="score-chip" id="modeSummary">練習模式</div>
      </header>

      <main class="app-shell">
        <aside class="control-panel">
          <section>
            <label class="field-label">模式</label>
            <div class="segmented" role="tablist" aria-label="模式">
              <button class="mode-button active" data-mode="practice" type="button">練習</button>
              <button class="mode-button" data-mode="history" type="button">歷年試題</button>
              <button class="mode-button" data-mode="random" type="button">隨機</button>
              <button class="mode-button" data-mode="exam" type="button">模擬考</button>
            </div>
          </section>

          <section>
            <label class="field-label" for="subjectSelect">科目</label>
            <select id="subjectSelect"></select>
          </section>

          <section class="type-settings" id="typeSettings">
            <label class="field-label" for="typeSelect">題型</label>
            <select id="typeSelect">
              <option value="all">全部題型</option>
              <option value="單選題">單選題</option>
              <option value="複選題">複選題</option>
            </select>
          </section>

          <section class="exam-settings" id="examSettings">
            <label class="field-label">題數</label>
            <div class="fixed-note" id="examCount">固定 50 題</div>
          </section>

          <section class="practice-settings" id="practiceSettings">
            <label class="field-label" for="practiceCount">題數</label>
            <select id="practiceCount">
              <option value="5">5 題</option>
              <option value="10">10 題</option>
              <option value="15">15 題</option>
              <option value="20">20 題</option>
              <option value="25">25 題</option>
              <option value="30">30 題</option>
              <option value="35">35 題</option>
              <option value="40">40 題</option>
              <option value="45">45 題</option>
              <option value="50" selected>50 題</option>
            </select>
          </section>

          <section class="history-settings" id="historySettings">
                <label class="field-label" for="yearSelect">年度／場次</label>
            <select id="yearSelect"></select>
            <label class="field-label history-count-label">題數</label>
            <div class="fixed-note" id="historyCount">—</div>
          </section>

          <section class="action-stack">
            <button id="primaryAction" class="primary-action" type="button">開始練習</button>
            <button id="secondaryAction" class="secondary-action" type="button">重設作答</button>
          </section>

          <section class="filter-stats" id="filterStats"></section>
        </aside>

        <section class="quiz-panel">
          <div class="toolbar">
            <button id="prevUnit" type="button" class="icon-button" aria-label="上一頁">‹</button>
            <div id="unitProgress"></div>
            <button id="nextUnit" type="button" class="icon-button" aria-label="下一頁">›</button>
          </div>
          <div id="quizContent" class="quiz-content"></div>
        </section>
      </main>
    </div>

    <script>
      // 密碼關卡 + 題庫解密（AES-256-GCM / PBKDF2-SHA256）。全部在瀏覽器本地完成，密碼不會送到任何伺服器。
      (function () {
        const ITER = 200000;
        const form = document.getElementById("gateForm");
        const pwInput = document.getElementById("gatePw");
        const btn = document.getElementById("gateBtn");
        const errorEl = document.getElementById("gateError");
        let encPromise = null;

        function setStatus(msg, isError) {
          errorEl.textContent = msg || "";
          errorEl.style.color = isError ? "" : "var(--muted)"; // 空字串=用 CSS 預設(紅色)
        }

        async function fetchEncBytes(onProgress) {
          const resp = await fetch("bank.enc?v=2");
          if (!resp.ok) throw new Error("找不到題庫檔 bank.enc");
          const total = Number(resp.headers.get("Content-Length")) || 0;
          if (!resp.body || !total) {
            return new Uint8Array(await resp.arrayBuffer());
          }
          const reader = resp.body.getReader();
          const chunks = [];
          let received = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            if (onProgress) onProgress(received / total);
          }
          const out = new Uint8Array(received);
          let offset = 0;
          for (const c of chunks) { out.set(c, offset); offset += c.length; }
          return out;
        }

        function loadEnc(onProgress) {
          if (!encPromise) encPromise = fetchEncBytes(onProgress);
          return encPromise;
        }

        async function decryptToText(password, bytes) {
          if (!(window.crypto && window.crypto.subtle)) {
            throw new Error("此瀏覽器環境不支援解密（需 https 或 localhost）");
          }
          const salt = bytes.slice(0, 16);
          const iv = bytes.slice(16, 28);
          const body = bytes.slice(28); // ciphertext + 16-byte auth tag
          const baseKey = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
          );
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const gzBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body); // gzip 位元組
          const stream = new Blob([gzBuf]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }

        function boot(quizDataText) {
          const json = quizDataText
            .replace(/^﻿/, "")
            .replace(/^\s*window\.QUIZ_DATA\s*=\s*/, "")
            .replace(/;\s*$/, "");
          window.QUIZ_DATA = JSON.parse(json);
          document.getElementById("gate").hidden = true;
          document.getElementById("app-root").hidden = false;
          const s = document.createElement("script");
          s.src = "app.js?v=2";
          document.body.appendChild(s); // app.js 讀 window.QUIZ_DATA 並自動 init()
        }

        const progress = (p) => setStatus("載入題庫中… " + Math.round(p * 100) + "%", false);

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const pw = pwInput.value.trim(); // 與加密端一致：去除前後空白
          if (!pw) return;
          btn.disabled = true;
          try {
            const bytes = await loadEnc(progress); // 下載題庫（顯示進度）
            setStatus("解密中…", false);
            const text = await decryptToText(pw, bytes);
            setStatus("", false);
            boot(text);
          } catch (err) {
            if (err && err.name === "OperationError") {
              setStatus("密碼錯誤（區分大小寫，注意大小寫與空白）。", true);
            } else if (err && String(err.message || "").includes("bank.enc")) {
              setStatus("題庫檔載入失敗，請重新整理再試。", true);
            } else if (err && String(err.message || "").includes("不支援")) {
              setStatus("此瀏覽器不支援解密，請改用較新的瀏覽器。", true);
            } else {
              setStatus("開啟失敗：" + (err && err.message ? err.message : "未知錯誤"), true);
            }
            btn.disabled = false;
            pwInput.select();
          }
        });

        // 顯示／隱藏密碼
        document.getElementById("gateShow").addEventListener("change", (e) => {
          pwInput.type = e.target.checked ? "text" : "password";
          pwInput.focus();
        });

        // 一進頁面就開始下載題庫並顯示進度，避免按下後像卡住；載完清掉狀態
        loadEnc(progress)
          .then(() => { if (!window.QUIZ_DATA) setStatus("", false); })
          .catch(() => {});
        pwInput.focus();
      })();
    </script>
  </body>
</html>
